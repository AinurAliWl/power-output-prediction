[project]
name = "power-output-prediction"
version = "1.0.0"
description = "ML Zoomcamp midterm: full-load electrical output estimation with a reproducible API"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.2",
  "scipy==1.16.2",
  "scikit-learn==1.7.2",
  "joblib==1.5.2",
  "matplotlib==3.10.8",
  "openpyxl==3.1.5",
  "fastapi==0.119.1",
  "pydantic==2.12.3",
  "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "httpx==0.28.1",
  "nbformat==5.10.4",
  "ipykernel==6.30.1",
  "jupyterlab==4.4.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
